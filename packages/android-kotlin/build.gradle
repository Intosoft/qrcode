plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.intosoft.qrcode'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'com.eclipsesource.j2v8:j2v8:6.2.1@aar'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Intosoft'
                artifactId = 'qrcode'
                version = '0.1.4'
                
                pom {
                    name = 'Intosoft QRCode Android'
                    description = 'Native Kotlin QR code generator with full customization'
                    url = 'https://github.com/Intosoft/qrcode'
                    
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/Intosoft/qrcode/blob/main/LICENSE'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'intosoft'
                            name = 'Sakul Budhathoki'
                            email = 'sakulbudhathoki977@gmail.com'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:git://github.com/Intosoft/qrcode.git'
                        developerConnection = 'scm:git:ssh://github.com/Intosoft/qrcode.git'
                        url = 'https://github.com/Intosoft/qrcode'
                    }
                }
            }
        }
    }
}
