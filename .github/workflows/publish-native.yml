name: Publish to JitPack

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android package
        run: |
          cd packages/android-kotlin
          ./gradlew build
          ./gradlew publishToMavenLocal

      - name: Notify JitPack
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          curl "https://jitpack.io/api/builds/com.github.Intosoft/qrcode/$TAG"

  publish-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Swift Package
        run: |
          cd packages/ios-swift
          swift build
          swift test || true

      - name: Create Release Notes
        run: |
          echo "## iOS Swift Package" >> $GITHUB_STEP_SUMMARY
          echo "Package is available via Swift Package Manager" >> $GITHUB_STEP_SUMMARY
          echo "Installation: \`https://github.com/Intosoft/qrcode.git\`" >> $GITHUB_STEP_SUMMARY
